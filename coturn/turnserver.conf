# ==============================================================================
# MeetMind AI — Coturn TURN Server Configuration
# Configured for restrictive enterprise firewalls, CGNAT & symmetric NAT traversal
# ==============================================================================

# Listening ports
listening-port=3478
tls-listening-port=443
alt-listening-port=3479
alt-tls-listening-port=5349

# Listening IP addresses (0.0.0.0 binds to all IPv4 interfaces)
listening-ip=0.0.0.0

# External IP address (replace with your server's public IPv4)
# external-ip=YOUR_PUBLIC_SERVER_IP

# Relay UDP port range (open this port range in your cloud security groups / firewall)
min-port=49152
max-port=65535

# Verbose logging
verbose
fingerprint

# WebRTC Long-term Authentication Mechanism
lt-cred-mech

# Realm name (matches your domain or platform)
realm=meetmind.ai

# Static user credentials (for testing / simple setups)
user=meetmind:SuperSecretTurnKey2026

# Ephemeral Time-Limited Credentials using static HMAC auth secret
# Matches TURN_SECRET in server/.env
use-auth-secret
static-auth-secret=meetmind_coturn_auth_secret_change_in_production

# Security & Anti-abuse limits
stale-nonce=600
max-allocate-per-user=10
total-quota=100
bps-capacity=0

# Disable insecure protocols
no-sslv2
no-sslv3
no-tlsv1
no-tlsv1_1

# SSL/TLS Certificates (for turns: over port 443)
# cert=/etc/coturn/certs/cert.pem
# pkey=/etc/coturn/certs/privkey.pem
